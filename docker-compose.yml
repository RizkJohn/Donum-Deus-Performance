services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deus
      POSTGRES_PASSWORD: deus
      POSTGRES_DB: deus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://deus:deus@postgres:5432/deus
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}      # no API key needed by default
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Content bot — generates Deus Performance social posts on a schedule.
  # Start with: docker compose --profile bot up content-bot
  content-bot:
    profiles: ["bot"]
    build:
      context: apps/content_bot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-88bf899d-a0aa-4c8a-9d24-c243a87008f3}
      PLATFORMS: ${PLATFORMS:-Instagram,TikTok,Threads}
      CONTENT_TYPES: ${CONTENT_TYPES:-Motivational,Educational}
      POSTS_PER_RUN: ${POSTS_PER_RUN:-6}
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 8 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  pgdata:
