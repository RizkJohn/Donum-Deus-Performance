services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deus}
      POSTGRES_DB: ${POSTGRES_DB:-deus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deus}:${POSTGRES_PASSWORD:-deus}@postgres:5432/${POSTGRES_DB:-deus}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}      # no API key needed by default
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Set API_KEY to a strong random secret in production.
      # When set, all API endpoints require the X-API-Key header.
      API_KEY: ${API_KEY:-}
      # Set DISABLE_DOCS=true to suppress /docs and /redoc in production.
      DISABLE_DOCS: ${DISABLE_DOCS:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      # Server-side URL used by Next.js API routes and server components.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000}
      # Must match API_KEY above — kept server-side (not NEXT_PUBLIC_).
      INTERNAL_API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Content bot — generates Deus Performance social posts on a schedule.
  # Start with: docker compose --profile bot up content-bot
  content-bot:
    profiles: ["bot"]
    build:
      context: apps/content_bot
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      PLATFORMS: ${PLATFORMS:-Instagram,TikTok,Threads}
      CONTENT_TYPES: ${CONTENT_TYPES:-Motivational,Educational}
      POSTS_PER_RUN: ${POSTS_PER_RUN:-6}
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 8 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  pgdata:
