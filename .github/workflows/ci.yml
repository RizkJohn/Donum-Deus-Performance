name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: api — pytest (offline, mock provider)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify library JSON is in sync with engine markdown
        run: python scripts/port_library.py && git diff --exit-code data/
      - name: Test
        run: python -m pytest -q

  web:
    name: web — build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (includes type-check)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
