name: Main Config
version: 1.0.0
schema: v1
models:
  - name: Llama 3.1 8B
    provider: ollama
    model: llama3.1:8b
    roles:
      - chat
      - edit
      - apply
  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles:
      - autocomplete
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    roles:
      - embed
  - name: qwen3
    provider: ollama
    model: qwen3
    capabilities:
      - tool_use
      - chat
      - edit
      - apply
      - autocomplete
      - embed
      - summarize
  - name: qwen2.5-coder
    provider: ollama
    model: qwen2.5-coder
    capabilities:
      - tool_use
      - chat
  - name: phi4
    provider: ollama
    model: phi4
