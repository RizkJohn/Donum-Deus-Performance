# Netlify deploy config — Donum Dei Performance website (Next.js 15).
#
# The site is the apps/web workspace of this monorepo. Netlify's Next.js
# runtime handles SSR, middleware, and the dynamic routes (/program/[id],
# /dashboard, the assessment funnel) natively — no code changes required.
#
# In the Netlify UI: New site → import this repo → the settings below are
# picked up automatically. Then set the custom domain to donumdeiperformance.com.

[build]
  base = "apps/web"
  command = "npm run build"

[build.environment]
  # Public API origin, baked into the browser bundle at build time. It must be
  # the VPS's public API URL. Override per-context in the Netlify UI if needed.
  NEXT_PUBLIC_API_URL = "https://api.donumdeiperformance.com"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly pin the Next.js runtime (Netlify auto-detects it too, but pinning
# is more reliable for a monorepo subdirectory).
[[plugins]]
  package = "@netlify/plugin-nextjs"
