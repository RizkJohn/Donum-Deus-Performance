# Donum Dei Performance — single-box production stack.
#
#   postgres · api · web · n8n · caddy (auto-HTTPS reverse proxy)
#
# Everything runs on one VPS. Only Caddy publishes ports (80/443); the API,
# web, n8n, and postgres are reachable only on the internal Docker network.
# Caddy terminates TLS and routes the three subdomains to the right service.
#
# Usage on the server (see docs/DEPLOYMENT.md for the full runbook):
#   cp .env.prod.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#   ./automation/import-workflows.sh n8n
#
# Requires these DNS A records pointing at the server IP:
#   ${WEB_DOMAIN}   ${API_DOMAIN}   ${N8N_DOMAIN}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: donum_dei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: donum_dei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donum_dei"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://donum_dei:${POSTGRES_PASSWORD}@postgres:5432/donum_dei
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGINS: https://${WEB_DOMAIN}
      WEB_URL: https://${WEB_DOMAIN}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${DDP_EMAIL_FROM:-Donum Dei Performance <programs@donumdeiperformance.com>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_FOUNDATION: ${STRIPE_PRICE_FOUNDATION}
      STRIPE_PRICE_PRACTICE: ${STRIPE_PRICE_PRACTICE}
      STRIPE_PRICE_STEWARDSHIP: ${STRIPE_PRICE_STEWARDSHIP}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        # Baked into the browser bundle at build time — MUST be the public API
        # URL, not an internal hostname. A runtime env var cannot fix this.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_WEBHOOK_BASE: https://${N8N_DOMAIN}
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
      DONUM_DEI_API_URL: http://api:8000
      DDP_WEB_URL: https://${WEB_DOMAIN}
      DDP_EMAIL_FROM: ${DDP_EMAIL_FROM:-Donum Dei Performance <programs@donumdeiperformance.com>}
      DDP_OWNER_EMAIL: ${DDP_OWNER_EMAIL}
      DDP_CLAUDE_MODEL: ${DDP_CLAUDE_MODEL:-claude-sonnet-5}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    expose:
      - "5678"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - n8n
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
